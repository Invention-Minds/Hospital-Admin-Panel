<!-- ═══════════════════════════════════════════════════════════════════════
     DocMinds sign-in.

     Behind the form runs one hospital day, told as six acts on a loop —
     front office, consultation, lab & radiology, the ward, theatre, and
     discharge & billing. Each act, as it plays, raises its own column on
     the planning board to the right, so by the end of the loop the board
     is full: the day's work *is* the management picture. That is the one
     thing the login screen is here to say.

     The whole scene is decorative: aria-hidden, pointer-events none, and
     every moving part is switched off under prefers-reduced-motion.
     ═══════════════════════════════════════════════════════════════════════ -->

<div class="lgn-auth">

  <!-- Ambient ground: a soft morning sky, two glows and a fine dot grid. -->
  <span class="glow glow-a" aria-hidden="true"></span>
  <span class="glow glow-b" aria-hidden="true"></span>
  <span class="grid-veil" aria-hidden="true"></span>

  <svg class="scene" viewBox="0 0 1440 360" preserveAspectRatio="xMidYMax meet"
       aria-hidden="true" focusable="false">

    <defs>
      <!-- Keeps the scrolling token queue inside its display board. -->
      <clipPath id="dmQueueClip">
        <rect x="104" y="122" width="124" height="52"/>
      </clipPath>
      <!-- Keeps the X-ray scan line inside the view box. -->
      <clipPath id="dmFilmClip">
        <rect x="104" y="104" width="134" height="94" rx="4"/>
      </clipPath>
    </defs>

    <!-- ── The hospital's pulse, along the foot of the page ─────────────
             One continuous vitals trace with a live beat running along it.
             It reads at any size, unlike the ward plan it replaced, which
             at this scale was just rows of boxes. -->
    <path class="pulse-base"
          d="M0 330 h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34"
          fill="none" stroke="#5882C1" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.26"/>
    <path class="pulse-live" pathLength="100" stroke-dasharray="7 93"
          d="M0 330 h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34
             h46 q10 -8 20 0 h10 l6 6 l8 -46 l8 52 l6 -12 h14 q14 -14 28 0 h34"
          fill="none" stroke="#FB9C2A" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ── The pipeline: the day's work flowing to the planning board ────
             It runs behind the sign-in card, which is the point — the link
             is continuous even where you cannot see it. -->

  <!-- ── Foreground ──────────────────────────────────────────────────── -->
  <div class="lgn-col">

    <!-- Mark plus wordmark, the same lockup the app header uses. The mark on
         its own carries no name, so the product was going unnamed on the one
         screen every user sees. The alt is empty because the name is right
         beside it as text. -->
    <div class="lgn-brand">
      <img src="/sidebar/IM-logo.png" alt=""/>
      <span class="lgn-brand__name">DocMinds</span>
    </div>

    <p class="lgn-kicker">One sign-in for the whole hospital</p>

    <div class="lgn-card">

      <div class="lgn-greet">
        <h1>{{ greeting }}</h1>
        <p class="lgn-greet__line">Welcome to seamless healthcare management.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="lgn-form">

        <div class="lgn-field">
          <label for="lgn-user">User ID</label>
          <div class="lgn-input">
            <i class="pi pi-user" aria-hidden="true"></i>
            <input
              id="lgn-user"
              type="text"
              name="username"
              [(ngModel)]="username"
              placeholder="Enter your user ID"
              autocomplete="username"
              aria-describedby="lgn-hint"
              required
            />
          </div>
        </div>

        <div class="lgn-field">
          <label for="lgn-pass">Password</label>
          <div class="lgn-input">
            <i class="pi pi-lock" aria-hidden="true"></i>
            <input
              id="lgn-pass"
              [type]="isPasswordVisible ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="lgn-eye"
              [attr.aria-label]="isPasswordVisible ? 'Hide password' : 'Show password'"
              (click)="togglePasswordVisibility()"
            >
              <i [class]="isPasswordVisible ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Which credential to use — the question the help desk fields daily -->
        <p class="lgn-hint" id="lgn-hint">
          <i class="pi pi-info-circle" aria-hidden="true"></i>
          <span>Use the user ID issued by your hospital administrator.</span>
        </p>

        <button type="submit" class="lgn-submit" [disabled]="!loginForm.valid || isLoading">
          @if (isLoading) {
            <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
            <span>Signing in…</span>
          } @else {
            <i class="pi pi-sign-in" aria-hidden="true"></i>
            <span>Sign In</span>
          }
        </button>

      </form>

      <p class="lgn-help">Trouble signing in? Contact your hospital administrator.</p>
    </div>

    <p class="lgn-legal">© {{ currentYear }} DocMinds · Seamless healthcare management</p>
  </div>

  <p-toast />
</div>
