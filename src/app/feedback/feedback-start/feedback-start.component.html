<div class="fks-shell" [attr.lang]="lang">
  <div class="fks-card">
    <div class="fks-langs" role="group" [attr.aria-label]="t.language">
      <button type="button" class="fks-lang" *ngFor="let l of LANGS"
              [class.fks-lang-on]="lang === l.code" [attr.aria-pressed]="lang === l.code"
              [attr.lang]="l.code" (click)="lang = l.code">{{ l.label }}</button>
    </div>

    <h1 class="fks-title">{{ t.startTitle }}</h1>

    <ng-container *ngIf="step === 'prn'">
      <p class="fks-sub">{{ t.startSub }}</p>

      <label class="fks-field">{{ t.prnLabel }}
        <input type="text" inputmode="numeric" maxlength="10" [(ngModel)]="patientPrn"
               [placeholder]="t.prnPh" autocomplete="off" (keyup.enter)="requestOtp()" />
      </label>

      <div class="fks-field-label">{{ t.visitQ }}</div>
      <div class="fks-visit-grid">
        <label class="fks-visit-opt" *ngFor="let v of VISIT_TYPES">
          <input type="radio" name="visitType" [value]="v" [(ngModel)]="visitType" />
          <span>{{ visitLabel(v) }}</span>
        </label>
      </div>

      <p class="fks-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="fks-submit" (click)="requestOtp()" [disabled]="submitting">
        {{ submitting ? t.sendingOtp : t.sendOtp }}
      </button>
      <p class="fks-foot">{{ t.prnHelp }}</p>
    </ng-container>

    <ng-container *ngIf="step === 'otp'">
      <p class="fks-sub">{{ t.otpSub }}</p>
      <p class="fks-info" *ngIf="infoMessage">{{ infoMessage }}</p>

      <label class="fks-field">{{ t.otpLabel }}
        <input class="fks-otp" type="text" inputmode="numeric" maxlength="6" [(ngModel)]="otp"
               placeholder="••••••" autocomplete="one-time-code" (keyup.enter)="verify()" />
      </label>

      <p class="fks-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="fks-submit" (click)="verify()" [disabled]="submitting">
        {{ submitting ? t.verifying : t.verify }}
      </button>

      <div class="fks-otp-actions">
        <button class="fks-link" (click)="resend()" [disabled]="resendIn > 0 || submitting">
          {{ resendIn > 0 ? resendLabel : t.resend }}
        </button>
        <button class="fks-link" (click)="changePrn()" [disabled]="submitting">{{ t.changePrn }}</button>
      </div>
    </ng-container>
  </div>
</div>
